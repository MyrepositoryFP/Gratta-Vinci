<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <title>Contatore Gratta e Vinci</title>
  <style>
    :root {
      --navy: #102a43;
      --blue: #1f6feb;
      --green: #14804a;
      --red: #c0392b;
      --bg: #edf2f7;
      --card: #ffffff;
      --text: #172b4d;
      --muted: #5e6c84;
      --line: #d9e2ec;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    }

    header {
      background: var(--navy);
      color: #fff;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 18px rgba(16, 42, 67, 0.18);
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 5vw, 34px);
      line-height: 1.1;
    }

    .date-label {
      margin: 9px 0 0;
      font-size: 16px;
      opacity: .9;
    }

    .hint {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 16px;
      text-align: center;
    }

    .tickets {
      display: grid;
      gap: 12px;
    }

    .ticket-row {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) auto auto auto;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 3px 9px rgba(23, 43, 77, .08);
    }

    .ticket-name {
      font-size: clamp(18px, 3.4vw, 23px);
      font-weight: 750;
      line-height: 1.2;
    }

    .ticket-subtotal {
      display: block;
      margin-top: 5px;
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
    }

    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
      font: inherit;
      font-weight: 800;
    }

    .counter-button {
      width: clamp(54px, 10vw, 68px);
      height: clamp(54px, 10vw, 68px);
      border-radius: 14px;
      color: #fff;
      font-size: 34px;
      line-height: 1;
      box-shadow: inset 0 -3px rgba(0,0,0,.12), 0 3px 7px rgba(0,0,0,.14);
    }

    .minus { background: var(--red); }
    .plus { background: var(--green); }
    button:active { transform: scale(.96); }

    .count {
      min-width: clamp(58px, 11vw, 76px);
      text-align: center;
      font-size: clamp(25px, 5vw, 34px);
      font-weight: 800;
      color: var(--navy);
    }

    .summary {
      margin-top: 20px;
      background: linear-gradient(135deg, #1f6feb, #174ea6);
      color: #fff;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 8px 18px rgba(31,111,235,.24);
    }

    .summary-title {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 750;
      opacity: .92;
    }

    .total-amount {
      font-size: clamp(32px, 8vw, 48px);
      font-weight: 850;
      line-height: 1;
    }

    .total-pieces {
      margin: 10px 0 0;
      font-size: 18px;
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .action {
      padding: 18px;
      min-height: 60px;
      border-radius: 14px;
      font-size: 18px;
      color: white;
    }

    .report { background: #7b2cbf; }
    .reset { background: #d35400; }

    .saved {
      margin: 15px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      padding: 18px;
      background: rgba(10, 25, 41, .68);
      align-items: center;
      justify-content: center;
    }

    .modal.open { display: flex; }

    .modal-card {
      width: min(620px, 100%);
      max-height: calc(100vh - 36px);
      overflow: auto;
      background: #fff;
      border-radius: 18px;
      padding: 22px;
    }

    .modal-card h2 {
      margin: 0 0 16px;
      color: var(--navy);
      font-size: 26px;
    }

    .report-list {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line);
    }

    .report-list li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
      font-size: 17px;
    }

    .report-total {
      margin: 18px 0;
      padding: 16px;
      border-radius: 12px;
      color: #fff;
      background: var(--navy);
      font-size: 20px;
      line-height: 1.55;
    }

    .close { background: var(--blue); }

    @media (max-width: 430px) {
      .ticket-row { gap: 8px; padding: 12px 10px; }
      .ticket-name { font-size: 17px; }
      .counter-button { border-radius: 12px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>🎟️ Contatore Gratta e Vinci</h1>
      <p class="date-label" id="currentDate"></p>
    </header>

    <p class="hint">Premi <strong>−</strong> o <strong>+</strong> per aggiornare le vendite di oggi.</p>

    <section class="tickets" id="tickets" aria-label="Contatori gratta e vinci"></section>

    <section class="summary" aria-live="polite">
      <p class="summary-title">INCASSO TOTALE DELLA GIORNATA</p>
      <div class="total-amount" id="totalAmount">€ 0,00</div>
      <p class="total-pieces" id="totalPieces">0 gratta e vinci venduti</p>
    </section>

    <section class="actions">
      <button class="action report" id="reportButton">📊 Resoconto finale</button>
      <button class="action reset" id="resetButton">🔄 Chiudi giornata e azzera</button>
    </section>

    <p class="saved" id="savedMessage">Salvataggio automatico attivo su questo dispositivo.</p>
  </main>

  <div class="modal" id="reportModal" role="dialog" aria-modal="true" aria-labelledby="reportTitle">
    <section class="modal-card">
      <h2 id="reportTitle">📊 Resoconto della giornata</h2>
      <ul class="report-list" id="reportList"></ul>
      <div class="report-total" id="reportTotal"></div>
      <button class="action close" id="closeReport">Chiudi</button>
    </section>
  </div>

  <script>
    const PREZZI = [5, 3, 10, 2, 1];
    const STORAGE_KEY = 'grattaVinciVenditeGiornataV2';
    const DATA_KEY = 'grattaVinciDataGiornataV2';

    let vendite = {};

    function euro(valore) {
      return new Intl.NumberFormat('it-IT', {
        style: 'currency',
        currency: 'EUR'
      }).format(valore);
    }

    function dataOggi() {
      return new Date().toLocaleDateString('it-IT', {
        weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
      });
    }

    function chiaveOggi() {
      const oggi = new Date();
      const anno = oggi.getFullYear();
      const mese = String(oggi.getMonth() + 1).padStart(2, '0');
      const giorno = String(oggi.getDate()).padStart(2, '0');
      return `${anno}-${mese}-${giorno}`;
    }

    function inizializza() {
      document.getElementById('currentDate').textContent = dataOggi();
      const dataSalvata = localStorage.getItem(DATA_KEY);
      const datiSalvati = localStorage.getItem(STORAGE_KEY);

      if (dataSalvata === chiaveOggi() && datiSalvati) {
        try {
          vendite = JSON.parse(datiSalvati);
        } catch {
          vendite = {};
        }
      }

      PREZZI.forEach(prezzo => {
        if (!Number.isInteger(vendite[prezzo]) || vendite[prezzo] < 0) {
          vendite[prezzo] = 0;
        }
      });

      disegnaRighe();
      aggiornaTutto();
    }

    function disegnaRighe() {
      const contenitore = document.getElementById('tickets');
      contenitore.innerHTML = '';

      PREZZI.forEach(prezzo => {
        const riga = document.createElement('article');
        riga.className = 'ticket-row';
        riga.innerHTML = `
          <div>
            <div class="ticket-name">Gratta e Vinci ${euro(prezzo)}</div>
            <span class="ticket-subtotal" id="subtotal-${prezzo}">Subtotale: € 0,00</span>
          </div>
          <button class="counter-button minus" type="button" aria-label="Diminuisci gratta e vinci da ${euro(prezzo)}" data-price="${prezzo}" data-change="-1">−</button>
          <div class="count" id="count-${prezzo}">0</div>
          <button class="counter-button plus" type="button" aria-label="Aggiungi gratta e vinci da ${euro(prezzo)}" data-price="${prezzo}" data-change="1">+</button>
        `;
        contenitore.appendChild(riga);
      });

      contenitore.querySelectorAll('[data-price]').forEach(button => {
        button.addEventListener('click', () => {
          modificaVendite(Number(button.dataset.price), Number(button.dataset.change));
        });
      });
    }

    function modificaVendite(prezzo, variazione) {
      const nuovaQuantita = vendite[prezzo] + variazione;
      if (nuovaQuantita < 0) return;
      vendite[prezzo] = nuovaQuantita;
      salva();
      aggiornaTutto();
    }

    function calcolaTotali() {
      const pezzi = PREZZI.reduce((somma, prezzo) => somma + vendite[prezzo], 0);
      const incasso = PREZZI.reduce((somma, prezzo) => somma + (vendite[prezzo] * prezzo), 0);
      return { pezzi, incasso };
    }

    function aggiornaTutto() {
      PREZZI.forEach(prezzo => {
        document.getElementById(`count-${prezzo}`).textContent = vendite[prezzo];
        document.getElementById(`subtotal-${prezzo}`).textContent = `Subtotale: ${euro(vendite[prezzo] * prezzo)}`;
      });

      const { pezzi, incasso } = calcolaTotali();
      document.getElementById('totalAmount').textContent = euro(incasso);
      document.getElementById('totalPieces').textContent = `${pezzi} ${pezzi === 1 ? 'gratta e vinci venduto' : 'gratta e vinci venduti'}`;
    }

    function salva() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(vendite));
      localStorage.setItem(DATA_KEY, chiaveOggi());
      const ora = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('savedMessage').tex
