<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Contatore Gratta e Vinci</title>
<style>
  :root{
    --rosso:#d32f2f;
    --rosso-dark:#a32424;
    --verde:#2e7d32;
    --verde-dark:#1e5c22;
    --arancio:#e65100;
    --arancio-dark:#b23c00;
    --sfondo:#f4f6f8;
    --carta:#ffffff;
    --testo:#1a1a1a;
    --bordo:#dfe3e7;
    --blu:#1565c0;
    --blu-dark:#0d47a1;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0;
    background:var(--sfondo);
    color:var(--testo);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    user-select:none;
    -webkit-user-select:none;
  }
  .container{
    max-width: 900px;
    margin: 0 auto;
    padding: 16px 16px 48px 16px;
  }
  header{
    text-align:center;
    padding: 12px 0 20px 0;
  }
  h1{
    font-size: clamp(24px, 5vw, 34px);
    margin: 0 0 6px 0;
  }
  .data-corrente{
    font-size: 16px;
    color:#555;
    font-weight:600;
  }
  .riga{
    background: var(--carta);
    border: 1px solid var(--bordo);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    display:flex;
    flex-wrap: wrap;
    align-items:center;
    gap: 12px;
  }
  .riga-nome{
    flex: 1 1 100%;
    font-size: 20px;
    font-weight: 700;
  }
  .riga-controlli{
    flex: 1 1 100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 18px;
  }
  .btn-conta{
    width: 64px;
    height: 64px;
    min-width:56px;
    min-height:56px;
    border-radius: 16px;
    border: none;
    font-size: 34px;
    font-weight: 800;
    color: white;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    touch-action: manipulation;
  }
  .btn-meno{ background: var(--rosso); }
  .btn-meno:active{ background: var(--rosso-dark); }
  .btn-piu{ background: var(--verde); }
  .btn-piu:active{ background: var(--verde-dark); }
  .contatore{
    min-width: 70px;
    text-align:center;
    font-size: 32px;
    font-weight: 800;
  }
  .riga-subtotale{
    flex: 1 1 100%;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    color: #333;
    background: #f0f2f4;
    border-radius: 10px;
    padding: 8px 0;
  }
  .totale-box{
    background: var(--blu);
    color: white;
    border-radius: 18px;
    padding: 20px;
    text-align:center;
    margin: 22px 0;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
  }
  .totale-box .riga-totale{
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 700;
    margin: 6px 0;
  }
  .azioni{
    display:flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 10px;
  }
  .btn-azione{
    min-height: 60px;
    border-radius: 16px;
    border: none;
    font-size: 20px;
    font-weight: 700;
    color: white;
    cursor:pointer;
    touch-action: manipulation;
  }
  .btn-resoconto{ background: var(--blu); }
  .btn-resoconto:active{ background: var(--blu-dark); }
  .btn-chiudi-giornata{ background: var(--arancio); }
  .btn-chiudi-giornata:active{ background: var(--arancio-dark); }

  .overlay{
    position: fixed;
    top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.5);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 16px;
    z-index: 999;
  }
  .overlay.attivo{ display:flex; }
  .modale{
    background: white;
    border-radius: 18px;
    max-width: 520px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 22px;
  }
  .modale h2{
    margin-top:0;
    font-size: 24px;
    text-align:center;
  }
  .modale .sottotitolo{
    text-align:center;
    color:#555;
    font-weight:600;
    margin-bottom: 16px;
  }
  .tabella-resoconto{
    width:100%;
    border-collapse: collapse;
    margin-bottom: 16px;
  }
  .tabella-resoconto th, .tabella-resoconto td{
    padding: 8px 6px;
    border-bottom: 1px solid var(--bordo);
    text-align: center;
    font-size: 15px;
  }
  .tabella-resoconto th{
    background: #f0f2f4;
  }
  .riepilogo-finale{
    background: #f0f2f4;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 18px;
  }
  .riepilogo-finale p{
    margin: 6px 0;
    font-size: 16px;
    font-weight: 700;
  }
  .btn-chiudi-modale{
    width:100%;
    min-height: 54px;
    border-radius: 14px;
    border:none;
    background: #555;
    color:white;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
  }
  .toast{
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #222;
    color:white;
    padding: 14px 22px;
    border-radius: 12px;
    font-size: 16px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.3s ease;
    z-index: 1100;
    text-align:center;
    max-width: 90%;
  }
  .toast.mostra{ opacity: 1; }

  @media (min-width: 640px){
    .riga{
      flex-wrap: nowrap;
    }
    .riga-nome{ flex: 1 1 30%; }
    .riga-controlli{ flex: 0 0 auto; }
    .riga-subtotale{ flex: 1 1 30%; text-align:right; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>🎟️ Contatore Gratta e Vinci</h1>
    <div class="data-corrente" id="dataCorrente"></div>
  </header>

  <div id="righeContainer"></div>

  <div class="totale-box">
    <div class="riga-totale" id="totaleVenduti">Totale gratta e vinci venduti: 0</div>
    <div class="riga-totale" id="incassoTotale">Incasso totale della giornata: € 0,00</div>
  </div>

  <div class="azioni">
    <button class="btn-azione btn-resoconto" id="btnResoconto">📊 RESOCONTO FINALE</button>
    <button class="btn-azione btn-chiudi-giornata" id="btnChiudiGiornata">🔄 CHIUDI GIORNATA E AZZERA</button>
  </div>
</div>

<div class="overlay" id="overlayResoconto">
  <div class="modale">
    <h2>Resoconto della giornata</h2>
    <div class="sottotitolo" id="dataResoconto"></div>
    <table class="tabella-resoconto">
      <thead>
        <tr>
          <th>Prezzo</th>
          <th>Quantità</th>
          <th>Subtotale</th>
        </tr>
      </thead>
      <tbody id="tabellaResocontoBody"></tbody>
    </table>
    <div class="riepilogo-finale">
      <p id="resocontoTotalePezzi"></p>
      <p id="resocontoIncasso"></p>
      <p id="resocontoMedia"></p>
    </div>
    <button class="btn-chiudi-modale" id="btnChiudiModale">Chiudi</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var CHIAVE_STORAGE = "gratta_vinci_dati_v1";

  var PREZZI = [5, 3, 10, 2, 1];

  var stato = null;

  function oggiStringa(){
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var g = String(d.getDate()).padStart(2,"0");
    return y + "-" + m + "-" + g;
  }

  function statoIniziale(){
    var contatori = {};
    PREZZI.forEach(function(p){ contatori[p] = 0; });
    return {
      giorno: oggiStringa(),
      contatori: contatori
    };
  }

  function caricaStato(){
    var salvato = null;
    try{
      var raw = localStorage.getItem(CHIAVE_STORAGE);
      if(raw){ salvato = JSON.parse(raw); }
    }catch(e){
      salvato = null;
    }

    if(!salvato || typeof salvato !== "object" || !salvato.contatori){
      return statoIniziale();
    }

    if(salvato.giorno !== oggiStringa()){
      return statoIniziale();
    }

    var nuovo = statoIniziale();
    PREZZI.forEach(function(p){
      var v = salvato.contatori[p];
      if(typeof v === "number" && v >= 0 && isFinite(v)){
        nuovo.contatori[p] = Math.floor(v);
      }
    });
    nuovo.giorno = salvato.giorno;
    return nuovo;
  }

  function salvaStato(){
    try{
      localStorage.setItem(CHIAVE_STORAGE, JSON.stringify(stato));
    }catch(e){
      // localStorage non disponibile: l'app continua a funzionare in memoria
    }
  }

  function formattaEuro(valore){
    var fissato = valore.toFixed(2);
    var parti = fissato.split(".");
    return "€ " + parti[0] + "," + parti[1];
  }

  function formattaDataItaliana(dataObj){
    var opzioni = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
    var testo = dataObj.toLocaleDateString("it-IT", opzioni);
    return testo.charAt(0).toUpperCase() + testo.slice(1);
  }

  function calcolaTotali(){
    var pezzi = 0;
    var incasso = 0;
    PREZZI.forEach(function(p){
      var q = stato.contatori[p];
      pezzi += q;
      incasso += q * p;
    });
    return { pezzi: pezzi, incasso: incasso };
  }

  function aggiornaVista(){
    PREZZI.forEach(function(p){
      var q = stato.contatori[p];
      var elContatore = document.getElementById("contatore-" + p);
      var elSubtotale = document.getElementById("subtotale-" + p);
      if(elContatore){ elContatore.textContent = q; }
      if(elSubtotale){ elSubtotale.textContent = "Subtotale: " + formattaEuro(q * p); }
    });

    var totali = calcolaTotali();
    document.getElementById("totaleVenduti").textContent =
      "Totale gratta e vinci venduti: " + totali.pezzi;
    document.getElementById("incassoTotale").textContent =
      "Incasso totale della giornata: " + formattaEuro(totali.incasso);
  }

  function modifica(prezzo, delta){
    var attuale = stato.contatori[prezzo];
    var nuovo = attuale + delta;
    if(nuovo < 0){ nuovo = 0; }
    stato.contatori[prezzo] = nuovo;
    salvaStato();
    aggiornaVista();
  }

  function creaRighe(){
    var container = document.getElementById("righeContainer");
    var html = "";
    PREZZI.forEach(function(p){
      html +=
        '<div class="riga">' +
          '<div class="riga-nome">Gratta e Vinci ' + formattaEuro(p) + '</div>' +
          '<div class="riga-controlli">' +
            '<button class="btn-conta btn-meno" data-prezzo="' + p + '" data-delta="-1" aria-label="Diminuisci">−</button>' +
            '<div class="contatore" id="contatore-' + p + '">0</div>' +
            '<button class="btn-conta btn-piu" data-prezzo="' + p + '" data-delta="1" aria-label="Aumenta">+</button>' +
          '</div>' +
          '<div class="riga-subtotale" id="subtotale-' + p + '">Subtotale: € 0,00</div>' +
        '</div>';
    });
    container.innerHTML = html;

    var bottoni = container.querySelectorAll(".btn-conta");
    bottoni.forEach(function(btn){
      btn.addEventListener("click", function(){
        var prezzo = parseInt(btn.getAttribute("data-prezzo"), 10);
        var delta = parseInt(btn.getAttribute("data-delta"), 10);
        modifica(prezzo, delta);
      });
    });
  }

  function mostraToast(messaggio){
    var toast = document.getElementById("toast");
    toast.textContent = messaggio;
    toast.classList.add("mostra");
    setTimeout(function(){
      toast.classList.remove("mostra");
    }, 2600);
  }

  function apriResoconto(){
    var oggi = new Date();
    document.getElementById("dataResoconto").textContent = formattaDataItaliana(oggi);

    var corpo = "";
    PREZZI.forEach(function(p){
      var q = stato.contatori[p];
      var sub = q * p;
      corpo +=
        "<tr>" +
          "<td>" + formattaEuro(p) + "</td>" +
          "<td>" + q + "</td>" +
          "<td>" + formattaEuro(sub) + "</td>" +
        "</tr>";
    });
    document.getElementById("tabellaResocontoBody").innerHTML = corpo;

    var totali = calcolaTotali();
    document.getElementById("resocontoTotalePezzi").textContent =
      "Numero totale di gratta e vinci venduti: " + totali.pezzi;
    document.getElementById("resocontoIncasso").textContent =
      "Incasso totale: " + formattaEuro(totali.incasso);

    var elMedia = document.getElementById("resocontoMedia");
    if(totali.pezzi > 0){
      var media = totali.incasso / totali.pezzi;
      elMedia.textContent = "Prezzo medio per gratta e vinci venduto: " + formattaEuro(media);
      elMedia.style.display = "";
    } else {
      elMedia.textContent = "";
      elMedia.style.display = "none";
    }

    document.getElementById("overlayResoconto").classList.add("attivo");
  }

  function chiudiResoconto(){
    document.getElementById("overlayResoconto").classList.remove("attivo");
  }

  function chiudiGiornata(){
    var totali = calcolaTotali();
    var messaggioConferma =
      "Chiudere la giornata e azzerare i contatori?\n\n" +
      "Totale gratta e vinci venduti: " + totali.pezzi + "\n" +
      "Incasso totale: " + formattaEuro(totali.incasso);

    var confermato = window.confirm(messaggioConferma);
    if(!confermato){ return; }

    stato = statoIniziale();
    salvaStato();
    aggiornaVista();
    mostraToast("Giornata chiusa. Contatori azzerati.");
  }

  function mostraDataCorrente(){
    document.getElementById("dataCorrente").textContent = formattaDataItaliana(new Date());
  }

  function controllaCambioGiorno(){
    if(stato.giorno !== oggiStringa()){
      stato = statoIniziale();
      salvaStato();
      aggiornaVista();
      mostraDataCorrente();
    }
  }

  function inizializza(){
    stato = caricaStato();
    mostraDataCorrente();
    creaRighe();
    aggiornaVista();

    document.getElementById("btnResoconto").addEventListener("click", apriResoconto);
    document.getElementById("btnChiudiModale").addEventListener("click", chiudiResoconto);
    document.getElementById("overlayResoconto").addEventListener("click", function(e){
      if(e.target === document.getElementById("overlayResoconto")){
        chiudiResoconto();
      }
    });
    document.getElementById("btnChiudiGiornata").addEventListener("click", chiudiGiornata);

    document.addEventListener("visibilitychange", function(){
      if(document.visibilityState === "visible"){
        controllaCambioGiorno();
      }
    });

    setInterval(controllaCambioGiorno, 60000);
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", inizializza);
  } else {
    inizializza();
  }
})();
</script>

</body>
</html>
